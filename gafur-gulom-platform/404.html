<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sahifa topilmadi | G'afur G'ulom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a3c5e 0%, #2a5a8a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        
        .container {
            max-width: 700px;
        }
        
        .error-code {
            font-family: 'Playfair Display', serif;
            font-size: 10rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 1rem;
            color: #c9a84c;
            text-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
        
        .quote {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-style: italic;
            margin: 2rem 0;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            border-left: 4px solid #c9a84c;
            line-height: 1.8;
        }
        
        .quote-author {
            font-size: 1rem;
            margin-top: 1rem;
            color: #c9a84c;
            font-weight: 600;
        }
        
        p {
            font-size: 1.25rem;
            line-height: 1.8;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
        
        .buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .btn-primary {
            background: #c9a84c;
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(201, 168, 76, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            border: 2px solid white;
            color: white;
        }
        
        .btn-secondary:hover {
            background: white;
            color: #1a3c5e;
        }
        
        .icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        @media (max-width: 768px) {
            .error-code {
                font-size: 6rem;
            }
            
            h1 {
                font-size: 1.75rem;
            }
            
            .quote {
                font-size: 1.125rem;
                padding: 1.5rem;
            }
            
            p {
                font-size: 1rem;
            }
            
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📚</div>
        <div class="error-code">404</div>
        <h1>Sahifa topilmadi</h1>
        
        <p>
            Afsuski, siz qidirayotgan sahifa mavjud emas yoki o'chirilgan. 
            Lekin bu - bilimga yo'l izlash jarayonining bir qismi!
        </p>
        
        <div class="quote">
            "Kitobsiz kun, quruq kun, 
            Kitobsiz kech, bosh kech!"
            <div class="quote-author">— G'afur G'ulom</div>
        </div>
        
        <div class="buttons">
            <a href="./" class="btn btn-primary">🏠 Bosh sahifaga qaytish</a>
            <a href="./pages/asarlar.html" class="btn btn-secondary">📖 She'rlar o'qish</a>
        </div>
    </div>
</body>
</html>
