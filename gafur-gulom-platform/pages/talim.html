<!DOCTYPE html>
<html lang="uz">
<head>
    <script src="/assets/js/platform-base.js?v=1"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ta'lim resurslari - G'afur G'ulom</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/assets/css/main.css?v=9">
    <link rel="stylesheet" href="/assets/css/components.css?v=9">
    <link rel="stylesheet" href="/assets/css/responsive.css?v=9">
    <link rel="stylesheet" href="/assets/css/platform-buttons.css?v=9">
    <link rel="stylesheet" href="/pages/talim.css?v=12">
</head>
<body class="page-talim">
    <div id="header-container"></div>

    <section class="tl-hero" aria-labelledby="tl-hero-title">
        <div class="tl-hero__backdrop" aria-hidden="true">
            <span class="tl-hero__orb tl-hero__orb--1"></span>
            <span class="tl-hero__orb tl-hero__orb--2"></span>
            <span class="tl-hero__grid"></span>
        </div>
        <div class="tl-hero__inner">
            <p class="tl-hero__kicker"><span class="tl-hero__kicker-dot" aria-hidden="true"></span>O'quv markazi</p>
            <h1 class="tl-hero__title" id="tl-hero-title">Ta'lim resurslari</h1>
            <p class="tl-hero__text">Dars rejalar, viktorina va savol banki — o'qituvchilar va o'quvchilar uchun G'afur G'ulom bo'yicha strukturali ta'lim.</p>
            <div class="tl-hero__stats" id="tl-hero-stats" aria-label="Ta'lim statistikasi"></div>
        </div>
        <div class="tl-hero__tabs-shell">
            <div class="tl-hero__tabs-inner">
                <nav class="tl-tabs tl-tabs--premium" aria-label="Ta'lim bo'limlari">
                    <button class="tab-btn active" type="button" data-tab="dars">
                        <span class="tab-btn__icon" aria-hidden="true">📖</span>
                        <span>Darslar</span>
                    </button>
                    <button class="tab-btn" type="button" data-tab="quiz">
                        <span class="tab-btn__icon" aria-hidden="true">🏆</span>
                        <span>Viktorina</span>
                    </button>
                    <button class="tab-btn" type="button" data-tab="bank">
                        <span class="tab-btn__icon" aria-hidden="true">📋</span>
                        <span>Savol Banki</span>
                    </button>
                </nav>
            </div>
        </div>
    </section>

    <main class="tl-page">
        <div class="tl-page__inner">
            <div class="tl-content-shell">

            <!-- Dars Rejalari -->
            <div class="tab-content active" data-tab="dars">
                <div class="tl-dars-main" id="lessons-container"></div>
            </div>

            <!-- Viktorina -->
            <div class="tab-content" data-tab="quiz">
                <div class="quiz-start" id="quiz-start">
                    <h2>Viktorinani boshlash</h2>
                    <input type="text" id="user-name" placeholder="Ismingizni kiriting" maxlength="50">
                    <h3>Sinf darajasi:</h3>
                    <div class="class-selector">
                        <button class="class-btn quiz-class-btn active" type="button" data-quiz-class="6">6-sinf</button>
                        <button class="class-btn quiz-class-btn" type="button" data-quiz-class="8">8-sinf</button>
                    </div>
                    <h3>Qiyinlik darajasi:</h3>
                    <div class="difficulty-btns">
                        <button class="difficulty-btn active" type="button" data-level="oson">
                            <div style="font-size: 1.75rem; margin-bottom: 0.35rem;">😊</div>
                            <div>Oson</div>
                        </button>
                        <button class="difficulty-btn" type="button" data-level="orta">
                            <div style="font-size: 1.75rem; margin-bottom: 0.35rem;">🤔</div>
                            <div>O'rta</div>
                        </button>
                        <button class="difficulty-btn" type="button" data-level="qiyin">
                            <div style="font-size: 1.75rem; margin-bottom: 0.35rem;">🔥</div>
                            <div>Qiyin</div>
                        </button>
                    </div>
                    <button class="tl-btn-primary tl-btn-navy" type="button" style="width:100%; padding: 1rem;" onclick="startQuiz()">Boshlash</button>
                </div>

                <div class="quiz-question" id="quiz-question" style="display: none;">
                    <div class="quiz-header">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                        <div class="timer" id="timer">60</div>
                    </div>
                    <p style="text-align: center; color: var(--tl-muted);" id="question-number"></p>
                    <div class="question-text" id="question-text"></div>
                    <div class="answers-grid" id="answers-container"></div>
                    <button class="tl-btn-primary tl-btn-navy" type="button" id="next-btn" style="display: none; width: 100%;" onclick="nextQuestion()">Keyingi savol →</button>
                </div>

                <div class="quiz-result" id="quiz-result" style="display: none;">
                    <h2>Viktorina yakunlandi!</h2>
                    <div class="stars" id="stars"></div>
                    <div class="score-display" id="score-display"></div>
                    <p id="result-message" style="font-size: 1.125rem; margin: 1.25rem 0;"></p>
                    <div id="wrong-answers" style="text-align: left; margin: 1.25rem 0;"></div>
                    <div class="tl-quiz-actions">
                        <button class="tl-btn-primary tl-btn-navy" type="button" onclick="restartQuiz()">Qaytadan urinish</button>
                        <button class="tl-btn-outline" type="button" onclick="newQuiz()">Boshqa test</button>
                        <button class="tl-btn-primary" type="button" id="cert-btn" style="display: none;" onclick="showCertificate()">Sertifikat</button>
                    </div>
                </div>
            </div>

            <!-- Savol Banki -->
            <div class="tab-content" data-tab="bank">
                <section class="tl-card">
                    <h2 class="tl-card__title">Savol banki</h2>
                    <div id="bank-container" class="lessons-grid"></div>
                </section>
            </div>
            </div>
        </div>
    </main>

    <div class="modal" id="cert-modal">
        <div class="modal-content">
            <button class="modal-close" type="button" onclick="closeCertModal()">×</button>
            <h2 style="text-align: center; margin-bottom: 1.25rem;">Tabriklaymiz!</h2>
            <canvas id="certificate-canvas" width="800" height="600"></canvas>
            <div style="text-align: center; margin-top: 1.25rem;">
                <button class="tl-btn-primary tl-btn-navy" type="button" onclick="downloadCertificate()">PNG yuklab olish</button>
            </div>
        </div>
    </div>

    <div class="modal tl-pdf-modal" id="tl-pdf-modal" aria-hidden="true">
        <div class="modal-content tl-pdf-modal__content">
            <button class="modal-close" type="button" id="tl-pdf-close" aria-label="Yopish">×</button>
            <h2 class="tl-pdf-modal__title" id="tl-pdf-title"></h2>
            <div class="tl-pdf-modal__frame-wrap">
                <iframe class="tl-pdf-modal__frame" id="tl-pdf-frame" title="PDF o'qish"></iframe>
            </div>
            <p class="tl-pdf-modal__hint">
                <a class="tl-pdf-modal__external" id="tl-pdf-external" href="#" target="_blank" rel="noopener noreferrer">PDF ni yangi oynada ochish</a>
            </p>
        </div>
    </div>

    <div id="footer-container"></div>

    <script src="/components/header.js"></script>
    <script src="/components/footer.js"></script>
    <script src="/assets/js/data.js"></script>
    <script src="/assets/js/app.js"></script>
    <script src="/pages/talim-page.js?v=15"></script>
</body>
</html>
